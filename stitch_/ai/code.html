<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-text-primary font-body-md h-screen overflow-hidden antialiased flex flex-col">
<!-- Branding Header (Positioned at Top) -->
<header class="absolute top-0 left-0 w-full p-stack-lg flex flex-col items-center">
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">会议助手</h1>
<p class="font-label-sm text-label-sm text-text-secondary">Efficiency First</p>
</header>
<!-- Main Centered Content Area -->
<main class="flex-1 flex items-center justify-center p-margin-page">
<!-- Central Status Card -->
<div class="w-full max-w-2xl bg-bg-card border border-border-base rounded-xl shadow-[0_4px_12px_rgba(31,35,41,0.06)] p-[48px] flex flex-col items-center">
<!-- Elegant Icon / Visual Anchor -->
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center mb-stack-lg relative">
<!-- Faux-glow effect for "AI/Magic" feel using standard tokens -->
<div class="absolute inset-0 rounded-full border border-primary-fixed opacity-50 scale-110"></div>
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<!-- Main Status Text -->
<h2 class="font-headline-md text-headline-md text-text-primary text-center mb-stack-sm">
            会议已结束，AI 正在深度智能分析并生成会议报告...
        </h2>
<p class="font-body-md text-body-md text-text-secondary text-center mb-stack-lg max-w-md">
            请稍候，我们正在为您提炼会议精华，生成结构化文档与待办清单。
        </p>
<!-- Progress Bar Container -->
<div class="w-full max-w-md mb-stack-lg">
<div class="flex justify-between items-center mb-stack-xs">
<span class="font-label-sm text-label-sm text-text-secondary">分析进度</span>
<span class="font-label-sm text-label-sm text-primary font-bold">65%</span>
</div>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<!-- Progress Fill (Static representation of 65%) -->
<div class="h-full bg-primary rounded-full w-[65%] shadow-[inset_0_1px_2px_rgba(255,255,255,0.3)]"></div>
</div>
</div>
<!-- Detailed Steps List -->
<div class="w-full max-w-md flex flex-col gap-stack-md mt-stack-sm">
<!-- Step 1: Completed -->
<div class="flex items-center gap-stack-md p-stack-sm rounded-lg bg-surface-bright">
<span class="material-symbols-outlined text-status-todo" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="flex-1">
<span class="font-body-md text-body-md text-text-secondary">提取核心观点...</span>
</div>
<span class="font-label-sm text-label-sm text-text-secondary">已完成</span>
</div>
<!-- Step 2: Active / In Progress -->
<div class="flex items-center gap-stack-md p-stack-sm rounded-lg border border-primary-fixed bg-surface-container-low shadow-[0_2px_4px_rgba(0,80,214,0.05)]">
<span class="material-symbols-outlined text-primary">sync</span>
<div class="flex-1">
<span class="font-title-md text-title-md text-text-primary">整理待办事项...</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">进行中</span>
</div>
<!-- Step 3: Pending -->
<div class="flex items-center gap-stack-md p-stack-sm rounded-lg opacity-60">
<span class="material-symbols-outlined text-text-placeholder">radio_button_unchecked</span>
<div class="flex-1">
<span class="font-body-md text-body-md text-text-placeholder">润色会议纪要...</span>
</div>
<span class="font-label-sm text-label-sm text-text-placeholder">等待中</span>
</div>
</div>
</div>
</main>
</body></html>
